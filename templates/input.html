<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Remote Input</title>
    <style>
        /* Removes default padding/margins and stops highlight boxes when tapping */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* Locks body to exact viewport dimensions and disables native scrolling */
        body { 
            background: black; margin: 0; padding: 0;
            font-family: sans-serif; color: white; 
            height: 100dvh; width: 100vw;
            overflow: hidden; display: flex; flex-direction: column;
            touch-action: none;
        }

        /* --- Header --- */
        /* Pins the navigation to the absolute top of the screen */
        .header-nav { 
            position: absolute; top: 0; left: 0; width: 100%; padding: 20px; z-index: 100;
        }
        /* Styles the white pill-shaped back button */
        .btn-back-pill {
            background: #ffffff; color: #000; padding: 12px 35px;
            border-radius: 50px; text-decoration: none; font-weight: 900;
            text-transform: uppercase; display: inline-block;
        }

        /* --- Vertical Center Wrapper --- */
        /* Forces the joystick block into the exact dead-center of the screen */
        .main-wrapper {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center; width: 100%;
        }

        /* Bounds the maximum width of the interface so it doesn't stretch on monitors */
        .content-container {
            width: 100%; max-width: 420px;
            display: flex; flex-direction: column; align-items: center; padding: 20px;
        }

        /* --- Trackpad Area --- */
        /* Creates the circular boundary for the joystick with an orange border */
        .input-card {
            background: #111; border: 2px solid #a02796; border-radius: 50%;
            width: 100%; aspect-ratio: 1 / 1;
            position: relative; overflow: hidden;
            box-shadow: 0 0 40px rgba(160, 39, 150, 0.3);
            margin-bottom: 40px;
        }

        /* The actual surface area that captures touch events */
        #joystick-container { width: 100%; height: 100%; background: #000; position: relative; }

        /* --- The Indicator (Slider Style) --- */
        /* The physical puck that moves under your thumb */
        #stick { 
            width: 80px; height: 80px; 
            background: #a02796; border: 5px solid white; border-radius: 50%; 
            position: absolute; top: calc(50% - 40px); left: calc(50% - 40px); 
            box-shadow: 0 0 25px rgba(160, 39, 150, 0.9);
            z-index: 50; pointer-events: none; 
        }

        /* --- Swapped Click Zones --- */
        /* Overlays invisible halves on the joystick for clicking */
        .click-zones { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; z-index: 10; }
        /* Splits the zone equally and centers the text */
        .zone {
            flex: 1; height: 100%; display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 0.8rem; color: rgba(255, 255, 255, 0.1); text-transform: uppercase;
        }
        /* Adds a subtle separator line down the middle */
        .zone-left { border-right: 1px solid rgba(160, 39, 150, 0.2); }
        /* Provides visual feedback when a zone is tapped */
        .zone:active { background: rgba(160, 39, 150, 0.2); }

        /* --- Keyboard Button --- */
        /* The button below the joystick that summons the mobile keyboard */
        .btn-keyboard {
            width: 100%; background: #a02796; color: white; border: none;
            padding: 22px; border-radius: 15px; font-weight: 900;
            text-transform: uppercase; font-size: 1.1rem;
            box-shadow: 0 0 20px rgba(160, 39, 150, 0.5);
        }

        /* Hides the actual text input field from view while keeping it functional */
        #hidden-input { position: absolute; opacity: 0; pointer-events: none; top: -100px; }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="/" class="btn-back-pill">BACK</a>
    </div>

    <div class="main-wrapper">
        <div class="content-container">
            <input type="text" id="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false">
            
            <div class="input-card">
                <div id="joystick-container">
                    <div class="click-zones">
                        <div class="zone zone-left" onclick="sendInput('right_click')">R-Click</div>
                        <div class="zone zone-right" onclick="sendInput('left_click')">L-Click</div>
                    </div>
                    <div id="stick"></div>
                </div>
            </div>

            <button class="btn-keyboard" onclick="openKeyboard()">Open Keyboard</button>
        </div>
    </div>

    <script>
        // Grabs DOM elements for manipulation
        const stick = document.getElementById('stick');
        const container = document.getElementById('joystick-container');
        const hiddenInput = document.getElementById('hidden-input');

        // --- TUNING PARAMETERS ---
        // Determines how heavily the movement is filtered (lower = smoother/heavier)
        const ALPHA = 0.35;      
        // Multiplier for win32api movement (higher = faster cursor traversal)
        const SENSITIVITY = 120; 
        
        // Tracks if the user's thumb is currently on the screen
        let active = false;
        // Tracks if the keyboard was manually requested open
        let isKeyboardOpen = false;
        // Stores the initial touch coordinates
        let startX, startY;
        
        // The immediate, unfiltered math from the finger movement
        let rawInput = { x: 0, y: 0 };
        // The delayed, smoothed math that gets sent to the server
        let smoothPos = { x: 0, y: 0 };

        // Calculates the maximum radius the puck can travel
        const getLimit = () => container.clientWidth / 2;

        // Triggers when thumb touches the joystick container
        container.addEventListener('touchstart', (e) => {
            active = true;
            // Records the starting X/Y origin point of the touch
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            // Refocuses the hidden input if the keyboard should stay open
            if (isKeyboardOpen) hiddenInput.focus();
        });

        // Triggers continuously as the thumb drags
        container.addEventListener('touchmove', (e) => {
            if (!active) return;
            const limit = getLimit();
            // Calculates distance moved from the original touch point
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            
            // Calculates absolute distance using Pythagorean theorem
            const dist = Math.sqrt(dx*dx + dy*dy);
            // Clamps the X value to the container's radius
            const clampedX = dist > limit ? dx * (limit/dist) : dx;
            // Clamps the Y value to the container's radius
            const clampedY = dist > limit ? dy * (limit/dist) : dy;
            
            // Visually moves the puck element on the screen
            stick.style.transform = `translate(${clampedX}px, ${clampedY}px)`;

            // Normalizes the coordinates to a -1.0 to 1.0 scale
            const normX = clampedX / limit;
            const normY = clampedY / limit;
            
            // Squares the normalized value for parabolic precision, reapplying the sign for direction
            rawInput.x = Math.pow(normX, 2) * Math.sign(normX);
            rawInput.y = Math.pow(normY, 2) * Math.sign(normY);
        });

        // Triggers when thumb lifts off the screen
        container.addEventListener('touchend', () => {
            active = false;
            // Snaps the puck back to center
            stick.style.transform = `translate(0px, 0px)`;
            // Zeros out the movement vectors
            rawInput = { x: 0, y: 0 };
        });

        // --- HIGH-SPEED SMOOTHING LOOP ---
        // Runs at the native refresh rate of the phone display (usually 60-120hz)
        function update() {
            // Low-Pass Filter: Blends the raw input with the previous smoothed position
            smoothPos.x = (rawInput.x * ALPHA) + (smoothPos.x * (1 - ALPHA));
            smoothPos.y = (rawInput.y * ALPHA) + (smoothPos.y * (1 - ALPHA));

            // Only sends network requests if the mouse actually needs to move
            if (Math.abs(smoothPos.x) > 0.001 || Math.abs(smoothPos.y) > 0.001) {
                const fd = new FormData();
                // Applies sensitivity scalar to the smoothed float
                fd.append('x', (smoothPos.x * SENSITIVITY));
                fd.append('y', (smoothPos.y * SENSITIVITY));
                // Sends the movement packet to the backend, keepalive ensures completion during rapid touches
                fetch('/mouse_move', { method: 'POST', body: fd, keepalive: true });
            }
            // Recursively calls the loop for the next display frame
            requestAnimationFrame(update);
        }
        // Starts the update loop
        requestAnimationFrame(update);

        // --- KEYBOARD & CLICKS ---
        // Summons the mobile keyboard
        function openKeyboard() {
            isKeyboardOpen = true;
            // Clears any leftover text
            hiddenInput.value = ""; 
            // Forces the OS to deploy the keyboard
            hiddenInput.focus();
        }

        // Listens for characters being typed into the invisible field
        hiddenInput.addEventListener('input', (e) => {
            const val = hiddenInput.value;
            // Grabs the last character typed
            const lastChar = val.slice(-1);
            
            // Detects if the user hit the backspace key on mobile
            if (val === "" && e.inputType === "deleteContentBackward") sendKey("BACKSPACE");
            // Sends standard characters
            else if (lastChar) sendKey(lastChar);
            
            // Periodically empties the field to prevent it from lagging
            if (val.length > 5) hiddenInput.value = ""; 
        });

        // Listens for hardware keys (Enter, Backspace on physical keyboards if connected)
        hiddenInput.addEventListener('keydown', (e) => {
            if (e.key === "Enter") sendKey("ENTER");
            if (e.key === "Backspace") sendKey("BACKSPACE");
        });

        // Sends right or left click commands
        function sendInput(cmd) {
            const fd = new FormData();
            fd.append('command', cmd);
            fetch('/input_command', { method: 'POST', body: fd });
            // Briefly delays, then refocuses the input so the keyboard doesn't dismiss when clicking
            if (isKeyboardOpen) setTimeout(() => hiddenInput.focus(), 10);
        }

        // Sends individual typed characters to the backend
        function sendKey(k) {
            const fd = new FormData();
            fd.append('key', k);
            fetch('/live_type', { method: 'POST', body: fd });
        }
    </script>
</body>
</html>
